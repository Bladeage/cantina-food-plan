name: Kantinen-Wochenplan

on:
  schedule:
    # GitHub-Cron kennt nur UTC. Damit der Versand ganzjährig 17:35 Ortszeit
    # trifft, gibt es je Slot einen Sommer- und einen Winter-Ausdruck; der
    # Guard-Schritt lässt nur den durch, der zur aktuellen Zeitzone passt.
    # Krumme Minute, weil Slots zur vollen Stunde 30-60 Minuten Verzug haben.
    - cron: "35 15 * * 0"   # So 15:35 UTC = 17:35 Ortszeit bei UTC+2 (Sommer)
    - cron: "35 16 * * 0"   # So 16:35 UTC = 17:35 Ortszeit bei UTC+1 (Winter)
    # Sicherheitsnetz (21:35 Ortszeit), falls der erste Slot ganz ausfällt.
    # Überspringt sich selbst, wenn schon ein Plan von heute vorliegt.
    - cron: "35 19 * * 0"   # So 19:35 UTC = 21:35 Ortszeit bei UTC+2 (Sommer)
    - cron: "35 20 * * 0"   # So 20:35 UTC = 21:35 Ortszeit bei UTC+1 (Winter)
  workflow_dispatch:        # manueller Start über den Actions-Tab
    inputs:
      debug:
        description: "Debug-Modus (rohe HTML-Struktur loggen + als Artefakt sichern)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Zeitzone für alle Schritte (Zeitstempel, Commit-Datum, KW-Berechnung).
      # Sommer-/Winterzeit wird über die Zeitzonendatenbank automatisch erkannt.
      PLAN_TZ: ${{ vars.PLAN_TZ || 'Europe/Berlin' }}
      TZ: ${{ vars.PLAN_TZ || 'Europe/Berlin' }}
    steps:
      - uses: actions/checkout@v4

      - name: Zeitzone prüfen & Sicherheitsnetz
        id: guard
        env:
          # github.event.schedule enthält den Cron-Ausdruck, der ausgelöst hat
          # (leer bei manuellem Start).
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os, pathlib
          from zoneinfo import ZoneInfo

          # Erwarteter UTC-Versatz je Cron-Ausdruck: +2 = Sommerzeit, +1 = Winterzeit
          SUMMER, WINTER = 2, 1
          CRON_OFFSET = {"35 15 * * 0": SUMMER, "35 16 * * 0": WINTER,
                         "35 19 * * 0": SUMMER, "35 20 * * 0": WINTER}
          FALLBACK_CRONS = {"35 19 * * 0", "35 20 * * 0"}

          tz_name = os.environ.get("PLAN_TZ") or "Europe/Berlin"
          try:
              now = dt.datetime.now(ZoneInfo(tz_name))
          except Exception:
              now = dt.datetime.now(dt.timezone.utc)
              tz_name = "UTC"
          offset = round(now.utcoffset().total_seconds() / 3600)

          schedule = (os.environ.get("SCHEDULE") or "").strip()
          skip, why = False, "Lauf wird ausgeführt."

          if schedule:
              print(f"Ausgelöst von Cron {schedule!r}; {tz_name} liegt aktuell bei "
                    f"UTC{offset:+d} ({'Sommerzeit' if offset == SUMMER else 'Winterzeit'}).")
              wanted = CRON_OFFSET.get(schedule)
              if wanted is not None and wanted != offset:
                  skip = True
                  why = ("Übersprungen – dieser Slot gilt für den anderen "
                         "Zeitzonen-Versatz (Sommer-/Winterzeit).")
              elif schedule in FALLBACK_CRONS:
                  plan = pathlib.Path("docs/plan.json")
                  generated = ""
                  if plan.exists():
                      try:
                          generated = json.loads(plan.read_text(encoding="utf-8"))["meta"]["generated"]
                      except Exception:
                          generated = ""
                  print(f"Sicherheitsnetz-Lauf; Plan zuletzt erzeugt: {generated or 'unbekannt'}")
                  if generated.startswith(now.date().isoformat()):
                      skip = True
                      why = "Übersprungen – der reguläre Lauf hat heute schon geliefert."

          print(why)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"skip={'true' if skip else 'false'}\n")
          PY

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        if: steps.guard.outputs.skip != 'true'
        run: pip install requests beautifulsoup4

      - name: Speiseplan holen & auswerten
        if: steps.guard.outputs.skip != 'true'
        working-directory: scripts
        env:
          OUT_DIR: ../docs
          PRICE_FACTOR: "1.5"
          # Basis-URL der Kantinen-Web-App – bewusst als Secret, damit sie
          # nicht im (ggf. öffentlichen) Repo steht.
          EUREST_BASE: ${{ secrets.EUREST_BASE }}
          # Optional: Bezeichnung in der Kopfzeile + Quell-Link in der Fußzeile.
          # PAGE_SHOW_DETAILS=0 hält Seite/plan.json neutral (ohne Bezeichnung/Quelle).
          PLAN_TITLE: ${{ secrets.PLAN_TITLE }}
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
          PAGE_SHOW_DETAILS: ${{ vars.PAGE_SHOW_DETAILS || '1' }}
          # DEBUG aus dem manuellen Trigger übernehmen (leer = aus)
          DEBUG: ${{ inputs.debug && '1' || '' }}
          # SEED_ID/SEED_DATE nur nötig, falls die IDs nicht im HTML stehen:
          SEED_ID: "146465"
          SEED_DATE: "27.07.2026"
        run: python fetch_menu.py

      - name: Debug-Artefakte sichern
        if: ${{ inputs.debug && steps.guard.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: |
            scripts/debug_main.html
            scripts/debug_day_*.html
            docs/plan.json
          if-no-files-found: warn
          retention-days: 7

      - name: Ergebnis committen (Pages aus /docs)
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "menu-bot"
          git config user.email "actions@github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Wochenplan $(date +%d.%m.%Y)"
          git push
