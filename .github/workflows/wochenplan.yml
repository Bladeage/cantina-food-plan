name: Kantinen-Wochenplan

on:
  schedule:
    # Krumme Minute: GitHub bedient Cron-Slots zur vollen Stunde deutlich
    # unzuverlässiger (Verzögerungen von 30-60 Minuten sind dort normal).
    - cron: "35 15 * * 0"   # Sonntag 15:35 UTC = 17:35 Uhr MESZ
    # Sicherheitsnetz mit Puffer, falls der erste Slot ganz ausfällt.
    # Überspringt sich selbst, wenn schon ein Plan von heute vorliegt.
    - cron: "35 19 * * 0"   # Sonntag 19:35 UTC = 21:35 Uhr MESZ
  workflow_dispatch:        # manueller Start über den Actions-Tab
    inputs:
      debug:
        description: "Debug-Modus (rohe HTML-Struktur loggen + als Artefakt sichern)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sicherheitsnetz – heute schon gelaufen?
        id: guard
        env:
          # github.event.schedule enthält den Cron-Ausdruck, der ausgelöst hat
          FALLBACK: ${{ github.event.schedule == '35 19 * * 0' }}
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os, pathlib

          skip = False
          if os.environ.get("FALLBACK") == "true":
              plan = pathlib.Path("docs/plan.json")
              generated = ""
              if plan.exists():
                  try:
                      generated = json.loads(plan.read_text(encoding="utf-8"))["meta"]["generated"]
                  except Exception:
                      generated = ""
              skip = generated.startswith(dt.date.today().isoformat())
              print(f"Sicherheitsnetz-Lauf; Plan zuletzt erzeugt: {generated or 'unbekannt'}")
          print("Übersprungen – der reguläre Lauf hat heute schon geliefert."
                if skip else "Lauf wird ausgeführt.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"skip={'true' if skip else 'false'}\n")
          PY

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        if: steps.guard.outputs.skip != 'true'
        run: pip install requests beautifulsoup4

      - name: Speiseplan holen & auswerten
        if: steps.guard.outputs.skip != 'true'
        working-directory: scripts
        env:
          OUT_DIR: ../docs
          PRICE_FACTOR: "1.5"
          # Basis-URL der Kantinen-Web-App – bewusst als Secret, damit sie
          # nicht im (ggf. öffentlichen) Repo steht.
          EUREST_BASE: ${{ secrets.EUREST_BASE }}
          # Optional: Bezeichnung in der Kopfzeile + Quell-Link in der Fußzeile.
          # PAGE_SHOW_DETAILS=0 hält Seite/plan.json neutral (nur Mail zeigt sie).
          PLAN_TITLE: ${{ secrets.PLAN_TITLE }}
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
          PAGE_SHOW_DETAILS: ${{ vars.PAGE_SHOW_DETAILS || '1' }}
          # DEBUG aus dem manuellen Trigger übernehmen (leer = aus)
          DEBUG: ${{ inputs.debug && '1' || '' }}
          # SEED_ID/SEED_DATE nur nötig, falls die IDs nicht im HTML stehen:
          SEED_ID: "146465"
          SEED_DATE: "27.07.2026"
        run: python fetch_menu.py

      - name: Debug-Artefakte sichern
        if: ${{ inputs.debug && steps.guard.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: |
            scripts/debug_main.html
            scripts/debug_day_*.html
            docs/plan.json
          if-no-files-found: warn
          retention-days: 7

      - name: Ergebnis committen (Pages aus /docs)
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "menu-bot"
          git config user.email "actions@github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Wochenplan $(date +%d.%m.%Y)"
          git push

      - name: E-Mail versenden
        if: always() && steps.guard.outputs.skip != 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          # Empfänger ausschließlich aus dem Secret (keine Adresse im Repo)
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          mv scripts/email_body.html . 2>/dev/null || true
          python scripts/send_mail.py
